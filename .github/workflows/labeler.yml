name: labeler

# Auto-labels PRs based on the files they touch.
# Labels are defined in .github/labeler.yml
#
# Uses pull_request_target so the GITHUB_TOKEN has write access even for
# fork PRs. The labeler only reads PR metadata (file paths) — it never
# checks out untrusted code — so pull_request_target is safe here.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true
